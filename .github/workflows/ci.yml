name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run that is still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked
      - run: uv run poe lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run poe test

  docker:
    name: Docker image and compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate compose file
        run: docker compose -f docker-compose.dev.yaml config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: smoke-watch-nordic:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run --rm smoke-watch-nordic:ci gdalinfo --version
          docker run --rm smoke-watch-nordic:ci python -c "import smoke_watch.flows.daily, smoke_watch.flows.backfill, smoke_watch.flows.forecast"
